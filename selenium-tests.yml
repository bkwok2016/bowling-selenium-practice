name: Selenium UI Tests

on: [push, pull_request]

jobs:
  selenium-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Start Flask app in the background
        run: |
          nohup python app.py > flask.log 2>&1 &
          # Wait for the app to actually be ready instead of a fixed sleep
          for i in $(seq 1 20); do
            if curl -sf http://localhost:5000/ > /dev/null; then
              echo "Flask app is up"
              break
            fi
            sleep 0.5
          done

      - name: Run Selenium tests
        env:
          HEADLESS: "true"
          BASE_URL: "http://localhost:5000"
        run: pytest test_ui_selenium.py -v

      - name: Show Flask logs on failure
        if: failure()
        run: cat flask.log
